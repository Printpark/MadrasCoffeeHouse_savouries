<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Karupatti House </title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:#fce9eb;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.card{

width:360px;
max-width:100%;

background:#ffffff;

border-radius:28px;

padding:35px 28px;

box-shadow:0 18px 40px rgba(0,0,0,.12);

}

.title{

text-align:center;

font-size:30px;

font-weight:bold;

color:#4b2c2c;

line-height:42px;

margin-bottom:35px;

}

hr{

border:none;

height:1px;

background:#ececec;

margin:22px 0;

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

font-size:18px;

padding:8px 0;

}

.label{

font-weight:bold;

color:#444;

}

.value{

color:#333;

text-align:right;

}

.product{

text-align:center;

font-size:28px;

font-weight:bold;

color:#7b4b2a;

margin:28px 0;

}

.price{

font-size:24px;

font-weight:bold;

color:#9b4f00;

}

</style>

</head>

<body>

<div class="card">

<div class="title">
Karupatti house 
  <br>
</div>

<div class="row">
<div class="label">FSSAI No.</div>
<div class="value">10026912000209</div>
</div>

<hr>

<div class="product">
Savouries
</div>

<hr>

<div class="row">
<div class="label">MRP</div>
<div class="value price">₹45/-</div>
</div>

<hr>

<div class="row">
<div class="label">Quantity</div>
<div class="value">100 gm</div>
</div>

<hr>
  
  <div class="row">
    <div class="label">MFD</div>
    <div class="value" id="mfdDate"></div>
</div>

<hr>

<div class="row">
<div class="label">Best Before</div>
<div class="value">30 Days from MFD</div>
</div>

</div>
  <script>
const today = new Date();

const options = {
    day: '2-digit',
    month: 'short',
    year: 'numeric'
};

document.getElementById("mfdDate").textContent =
    today.toLocaleDateString("en-GB", options);
  </script>

</body>
</html>
